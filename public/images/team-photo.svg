<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" rx="8" fill="#f5f5f5"/>
  
  <!-- Green Building Outline -->
  <path d="M150 300L300 150L450 300H150Z" stroke="#00C853" stroke-width="4" fill="#00C85315"/>
  <rect x="200" y="240" width="200" height="160" rx="4" stroke="#00C853" stroke-width="4" fill="#00C85310"/>
  
  <!-- Windows -->
  <rect x="230" y="270" width="40" height="40" rx="2" fill="#00C85320"/>
  <rect x="330" y="270" width="40" height="40" rx="2" fill="#00C85320"/>
  <rect x="230" y="330" width="40" height="40" rx="2" fill="#00C85320"/>
  <rect x="330" y="330" width="40" height="40" rx="2" fill="#00C85320"/>
  
  <!-- Professionals -->
  <circle cx="200" cy="200" r="40" fill="#333333"/>
  <circle cx="300" cy="200" r="40" fill="#333333"/>
  <circle cx="400" cy="200" r="40" fill="#333333"/>
  
  <!-- Text -->
  <rect x="150" y="100" width="300" height="40" rx="4" fill="#00C853"/>
  <text x="300" y="125" font-family="Arial" font-size="20" text-anchor="middle" fill="white">UrbanGrid Property Inspection Team</text>
  
  <!-- Safety Equipment -->
  <circle cx="200" cy="180" r="15" fill="white"/>
  <circle cx="300" cy="180" r="15" fill="white"/>
  <circle cx="400" cy="180" r="15" fill="white"/>
</svg>