<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Logo</title>
  <style>
    body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
    .logo-container { 
      display: flex; 
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .logo {
      font-family: Arial, sans-serif;
      font-weight: 700;
      font-size: 36px;
      letter-spacing: 1px;
    }
    .urban { color: #2D7E45; }
    .grid { color: #000000; }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo">
      <span class="urban">URBAN</span><span class="grid">GRID</span>
    </div>
  </div>
  <p>Right-click on the logo and select "Save image as..." to save as PNG</p>
</body>
</html>
